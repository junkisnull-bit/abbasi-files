<!doctype html><html><head><meta charset="utf-8"><title>ShopOS Desktop</title><style>body{font:15px system-ui;background:#f1f5f9;margin:0;color:#1d2939}header{background:#172b4d;color:white;padding:20px;font-size:22px}main{max-width:1150px;margin:auto;padding:20px}section{background:white;padding:20px;margin-bottom:18px;border-radius:10px}input,button{padding:10px;margin:4px;border:1px solid #ccd3dc;border-radius:5px}button{background:#1267a6;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.warning{color:#a64d00}</style></head><body><header>ShopOS Desktop — Offline Grocery POS</header><main><p class="warning">Pilot version: test with sample transactions before live shop use.</p><section><h2>Checkout</h2><div class="row"><input id="scan" placeholder="Scan barcode / Enter" autofocus><button id="add">Add</button><span id="message"></span></div><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead><tbody id="cart"></tbody></table><h2 id="total"></h2><label>Cash received (PKR) <input type="number" id="cash" min="0" step=".01"></label><button id="checkout">Complete sale & print</button><button id="clear">Clear cart</button></section><section><h2>Products & inventory</h2><form id="form"><input id="barcode" placeholder="Barcode" required><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" step=".01" placeholder="Price PKR" required><input id="stock" type="number" min="0" step="1" placeholder="Stock" required><button>Save product</button></form><input id="search" placeholder="Search products"><table><thead><tr><th>Barcode</th><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="products"></tbody></table></section><section><h2>Sales history</h2><button id="backup">Save SQLite backup</button><table><thead><tr><th>Receipt #</th><th>Date</th><th>Total</th><th>Paid</th></tr></thead><tbody id="sales"></tbody></table></section></main><script>
let products=[],cart=[],sales=[];const e=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>'Rs '+(n/100).toFixed(2);async function refresh(){products=await pos.products();sales=await pos.sales();render()}
function render(){e('cart').innerHTML=cart.map((x,i)=>{const p=products.find(p=>p.barcode===x.barcode);return '<tr><td>'+esc(p.name)+'</td><td><input type="number" min="0" max="'+p.stock+'" value="'+x.qty+'" data-i="'+i+'" class="qty"></td><td>'+fmt(p.price)+'</td><td>'+fmt(p.price*x.qty)+'</td><td><button data-i="'+i+'" class="remove">Remove</button></td></tr>'}).join('');e('total').textContent='Total: '+fmt(cart.reduce((a,x)=>a+products.find(p=>p.barcode===x.barcode).price*x.qty,0));const q=e('search').value.toLowerCase();e('products').innerHTML=products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q)).map(p=>'<tr><td>'+esc(p.barcode)+'</td><td>'+esc(p.name)+'</td><td>'+fmt(p.price)+'</td><td>'+p.stock+'</td><td><button class="pick" data-code="'+esc(p.barcode)+'">Add</button></td></tr>').join('');e('sales').innerHTML=sales.map(s=>'<tr><td>'+s.id+'</td><td>'+esc(s.created_at)+'</td><td>'+fmt(s.total)+'</td><td>'+fmt(s.paid)+'</td></tr>').join('')}
function add(code){const p=products.find(p=>p.barcode===code);if(!p){e('message').textContent='Unknown barcode';return}const item=cart.find(x=>x.barcode===code);if((item?.qty||0)>=p.stock){e('message').textContent='Out of stock';return}if(item)item.qty++;else cart.push({barcode:code,qty:1});e('scan').value='';e('message').textContent=p.name+' added';render();e('scan').focus()}
e('add').onclick=()=>add(e('scan').value.trim());e('scan').onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();add(e('scan').value.trim())}};e('search').oninput=render;
e('cart').onchange=ev=>{if(!ev.target.classList.contains('qty'))return;const i=+ev.target.dataset.i,p=products.find(p=>p.barcode===cart[i].barcode);cart[i].qty=Math.max(0,Math.min(p.stock,Math.floor(Number(ev.target.value)||0)));cart=cart.filter(x=>x.qty);render()};
e('cart').onclick=ev=>{if(ev.target.classList.contains('remove')){cart.splice(+ev.target.dataset.i,1);render()}};e('products').onclick=ev=>{if(ev.target.classList.contains('pick'))add(ev.target.dataset.code)};e('clear').onclick=()=>{cart=[];render()};
e('form').onsubmit=async ev=>{ev.preventDefault();try{await pos.saveProduct({barcode:e('barcode').value.trim(),name:e('name').value.trim(),price:Math.round(Number(e('price').value)*100),stock:Number(e('stock').value)});ev.target.reset();await refresh()}catch(err){alert(err.message)}};
e('checkout').onclick=async()=>{try{const paid=Math.round(Number(e('cash').value)*100);const sale=await pos.checkout({items:cart,paid});cart=[];e('cash').value='';await refresh();const receipt='<h2>ShopOS Receipt #'+sale.id+'</h2>'+sale.items.map(p=>'<p>'+esc(p.name)+' x '+p.qty+' = '+fmt(p.price*p.qty)+'</p>').join('')+'<hr><b>Total '+fmt(sale.total)+'</b><p>Paid '+fmt(sale.paid)+'</p><p>Change '+fmt(sale.paid-sale.total)+'</p>';const w=window.open('','receipt','width=420,height=600');if(w){w.document.write(receipt);w.document.close();w.print()}else alert('Sale saved. Receipt popup unavailable')}catch(err){alert(err.message)}};
e('backup').onclick=async()=>{try{if(await pos.backup())alert('Backup saved')}catch(err){alert(err.message)}};refresh().catch(err=>alert('Database error: '+err.message));
</script></body></html>
